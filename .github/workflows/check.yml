name: Colsubsidio Natación Checker

on:
  schedule:
    # Se ejecuta cada 10 minutos
    - cron: '*/10 * * * *'
  repository_dispatch:
    types: [check]
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar reporte completo de disponibilidad en Telegram'
        required: false
        type: boolean
        default: false

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r code/requirements.txt

    - name: Caché de Navegadores Playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('code/requirements.txt') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Instalar Navegador Playwright y Dependencias
      run: |
        python -m playwright install --with-deps chromium

    - name: Restaurar Caché de Estado
      uses: actions/cache/restore@v4
      with:
        path: |
          .cooldown_state
          .last_slots.json
        key: state-cache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          state-cache-

    - name: Ejecutar Revisor
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        COLSUBSIDIO_USER: ${{ secrets.COLSUBSIDIO_USER }}
        COLSUBSIDIO_PASS: ${{ secrets.COLSUBSIDIO_PASS }}
        COLSUBSIDIO_SISTEMA_COOKIE: ${{ secrets.COLSUBSIDIO_SISTEMA_COOKIE }}
        COLSUBSIDIO_CSRF_TOKEN: ${{ secrets.COLSUBSIDIO_CSRF_TOKEN }}
        COLSUBSIDIO_DOCUMENT_TYPE: ${{ secrets.COLSUBSIDIO_DOCUMENT_TYPE }}
        COLSUBSIDIO_DOCUMENT_NUMBER: ${{ secrets.COLSUBSIDIO_DOCUMENT_NUMBER }}
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          python code/main.py --once --force
        else
          python code/main.py --once
        fi

    - name: Guardar Caché de Estado
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          .cooldown_state
          .last_slots.json
        key: state-cache-${{ github.run_id }}-${{ github.run_attempt }}
