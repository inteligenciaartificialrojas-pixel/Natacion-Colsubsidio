name: Colsubsidio Natación Checker

on:
  schedule:
    # Se ejecuta cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r code/requirements.txt

    - name: Restaurar Caché de Cooldown
      uses: actions/cache/restore@v4
      with:
        path: .cooldown_state
        key: cooldown-state-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cooldown-state-

    - name: Ejecutar Revisor
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        COLSUBSIDIO_SISTEMA_COOKIE: ${{ secrets.COLSUBSIDIO_SISTEMA_COOKIE }}
        COLSUBSIDIO_CSRF_TOKEN: ${{ secrets.COLSUBSIDIO_CSRF_TOKEN }}
        COLSUBSIDIO_DOCUMENT_TYPE: ${{ secrets.COLSUBSIDIO_DOCUMENT_TYPE }}
        COLSUBSIDIO_DOCUMENT_NUMBER: ${{ secrets.COLSUBSIDIO_DOCUMENT_NUMBER }}
      run: |
        python code/main.py --once

    - name: Guardar Caché de Cooldown
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .cooldown_state
        key: cooldown-state-${{ github.run_id }}-${{ github.run_attempt }}
